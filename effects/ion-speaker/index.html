<!doctype html><meta charset="utf-8"><title>ION Speaker Prototype</title><script>(async()=>{const files=['source-1.b64','source-02.b64','source-03.b64','source-04.b64','source-05.b64','source-06.b64','source-07.b64','source-08.b64','source-09.b64','source-10.b64','source-11.b64'];const parts=await Promise.all(files.map(f=>fetch('./'+f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const html=decodeURIComponent(escape(atob(parts.join('').replace(/\s/g,''))));document.open();document.write(html);document.close()})().catch(e=>document.body.textContent='Failed to load effect: '+e.message)</script>
