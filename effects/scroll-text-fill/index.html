<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scroll Text Fill</title>
<style>
:root{--bg:#f2eee5;--idle:#d2d1cc;--active:#10221e;--pad:clamp(22px,5vw,72px)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100%;background:var(--bg);color:var(--active);font-family:Georgia,"Times New Roman",serif}.intro,.outro{min-height:70vh;display:grid;place-items:center;padding:var(--pad);color:rgba(16,34,30,.45);font-family:Arial,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.reveal-section{min-height:250vh;position:relative}.sticky{position:sticky;top:0;min-height:100svh;display:flex;align-items:center;padding:var(--pad);overflow:hidden}.copy{width:min(1120px,100%);margin:0;font-size:clamp(42px,7.05vw,94px);line-height:.91;letter-spacing:-.048em;font-weight:400;text-wrap:pretty;color:var(--idle)}.char{display:inline;color:var(--idle);will-change:color}.space{white-space:pre}.progress{position:fixed;right:18px;bottom:18px;width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(16,34,30,.18);border-radius:50%;background:rgba(242,238,229,.72);backdrop-filter:blur(12px);font:500 11px/1 Arial,sans-serif;color:rgba(16,34,30,.7);z-index:10}@media(max-width:700px){.intro,.outro{min-height:45vh}.reveal-section{min-height:210vh}.sticky{align-items:center}.copy{font-size:clamp(40px,11.6vw,64px);line-height:.92}}@media(prefers-reduced-motion:reduce){.char{color:var(--active)!important}.progress{display:none}}body.preview{overflow:hidden}body.preview .intro,body.preview .outro{display:none}body.preview .reveal-section{min-height:100svh}body.preview .sticky{position:relative}body.preview .copy{font-size:clamp(30px,5.5vw,62px)}
</style>
</head>
<body>
<div class="intro">Scroll to reveal</div>
<section class="reveal-section" id="revealSection"><div class="sticky"><p class="copy" id="copy" aria-label="Centrally situated in Bend's Old Mill District, steps from the Deschutes River and Hayden Homes Amphitheater, The Bend Club offers 16 luxury townhome residences with concierge programming year-round.">Centrally situated in Bend's Old Mill District, steps from the Deschutes River and Hayden Homes Amphitheater, The Bend Club offers 16 luxury townhome residences with concierge programming year-round.</p></div></section>
<div class="outro">Complete</div><div class="progress" id="progress">0%</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script>
(()=>{const copy=document.getElementById('copy'),progressEl=document.getElementById('progress'),section=document.getElementById('revealSection'),isPreview=new URLSearchParams(location.search).has('preview');if(isPreview)document.body.classList.add('preview');const original=copy.textContent;copy.textContent='';const chars=[...original].map(char=>{const span=document.createElement('span');span.className=char===' '?'char space':'char';span.textContent=char;copy.appendChild(span);return span});const setProgress=value=>{const p=Math.max(0,Math.min(1,value)),total=chars.length,head=p*(total+16)-8;chars.forEach((char,index)=>{const local=Math.max(0,Math.min(1,head-index)),eased=local*local*(3-2*local),idle=[210,209,204],active=[16,34,30],rgb=idle.map((start,i)=>Math.round(start+(active[i]-start)*eased));char.style.color=`rgb(${rgb.join(',')})`});progressEl.textContent=Math.round(p*100)+'%'};setProgress(isPreview?.18:0);if(isPreview){if(window.gsap){const state={p:.12};gsap.timeline({repeat:-1,repeatDelay:.65}).to(state,{p:1,duration:3.6,ease:'power1.inOut',onUpdate:()=>setProgress(state.p)}).to(state,{p:.12,duration:.55,ease:'power2.inOut',onUpdate:()=>setProgress(state.p)},'+=.35')}else{let start=performance.now();const loop=now=>{const cycle=((now-start)%4800)/4800,p=cycle<.78?(.12+.88*(cycle/.78)):(1-.88*((cycle-.78)/.22));setProgress(p);requestAnimationFrame(loop)};requestAnimationFrame(loop)}return}if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);const state={p:0};gsap.to(state,{p:1,ease:'none',scrollTrigger:{trigger:section,start:'top top',end:'bottom bottom',scrub:.65,invalidateOnRefresh:true},onUpdate:()=>setProgress(state.p)})}else{const update=()=>{const rect=section.getBoundingClientRect(),travel=Math.max(1,section.offsetHeight-innerHeight);setProgress(Math.max(0,Math.min(1,-rect.top/travel)))};addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update()}})();
</script>
</body>
</html>
