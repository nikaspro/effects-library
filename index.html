<!doctype html>

<head>

<title>Valera Motion Library</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<body>
<div class="header-shell">
<header class="glass-header" id="glassHeader">
<a class="brand brand-drop" href="#hero" aria-label="valera"><span class="brand-letter" style="--i:0">v</span><span class="brand-letter" style="--i:1">a</span><span class="brand-letter" style="--i:2">l</span><span class="brand-letter" style="--i:3">e</span><span class="brand-letter" style="--i:4">r</span><span class="brand-letter" style="--i:5">a</span></a>

<a class="tab" data-page-link="text" href="#text">Текст</a>
</nav>
<button aria-label="Переключить тему" class="theme-toggle" id="themeToggle" type="button">◐</button>
</header>
</div>
<main>
<section class="page" data-page="hero" id="heroPage">
<div class="grid">
<article class="card hero-card" data-demo="effects/ascii-cursor-field/?preview=1"><div class="preview"><iframe title="ASCII Cursor Field"></iframe><div class="poster"><span>cursor</span></div></div><div class="card-title">ASCII Cursor Field</div></article>

<article class="card hero-card" data-demo="effects/glass-header/?preview=1"><div class="preview"><iframe title="Glass Header"></iframe><div class="poster"><span>header</span></div></div><div class="card-title">Glass Header</div></article>
<article class="card hero-card" data-demo="effects/ion-speaker/?preview=1"><div class="preview"><iframe title="ION Speaker Prototype"></iframe><div class="poster"><span>product story</span></div></div><div class="card-title">ION Speaker Prototype</div></article>
</div>

</div>
